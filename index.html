<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Диагностика нравственных суждений (Кольберг)</title>
<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1d2433;--m:#667;--a:#3a5bd9;--b:#dde1ee}
@media(prefers-color-scheme:dark){:root{--bg:#161a24;--c:#202636;--t:#e8ebf5;--m:#9aa3b8;--a:#7b95ff;--b:#323a50}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:auto;padding:16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:18px;margin-bottom:14px}
h1{font-size:22px}h2{font-size:18px;margin-top:0}.m{color:var(--m);font-size:14px}
label.o{display:block;border:1px solid var(--b);border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}
label.o:has(input:checked){border-color:var(--a);background:color-mix(in srgb,var(--a) 12%,transparent)}
button,input[type=text]{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--b);background:var(--c);color:var(--t)}
button.p{background:var(--a);color:#fff;border:0}button:disabled{opacity:.4}
.bar{height:14px;background:var(--b);border-radius:7px;overflow:hidden;margin:2px 0 10px}.bar i{display:block;height:100%;background:var(--a)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style></head><body><main>
<div id="app"></div>
<script>
// ===== НАСТРОЙКА =====
// Адрес веб-приложения Google Apps Script для централизованного сбора (см. инструкцию). Пусто = только скачивание файла.
const SEND_URL="https://script.google.com/macros/s/AKfycbwqRUDWqei2Ptauil_954PUPLyR1vgPcQrr6dZ6i51bTsEfIlzITvViHLDNiZ7JHnGE2A/exec";
// ======================
const D=[
{t:"Жена Хайнца умирает. Единственное лекарство продаёт аптекарь по цене, которую Хайнц не может собрать. Должен ли он украсть лекарство? Какое рассуждение вам ближе?",
o:["Красть нельзя: его поймают, посадят в тюрьму и накажут.","Стоит рискнуть: если жена выживет, она будет о нём заботиться.","Хороший муж спасает жену; равнодушие осудили бы все близкие.","Закон нарушать нельзя, иначе порядок рухнет; надо искать законный путь и отвечать за поступок.","Право на жизнь выше права собственности; это крайняя мера, а систему цен на лекарства надо менять."]},
{t:"Друг признался, что списал на экзамене. Ему грозит отчисление, а преподаватель спрашивает вас напрямую. Говорить ли правду?",
o:["Скажу: за ложь накажут и меня.","Промолчу: сегодня я прикрою его, завтра он прикроет меня.","Не выдам: настоящий друг так не поступает, иначе меня сочтут предателем.","Правила экзамена одинаковы для всех; их нарушение подрывает доверие к системе, поэтому лгать нельзя.","Честность и равные права всех студентов важнее, но я убедил бы друга признаться самому и просил бы о справедливой мере."]},
{t:"Начальник велит скрыть от клиентов дефект товара, иначе фирму закроют и людей уволят. Как поступить?",
o:["Сделаю, как велит начальник: иначе меня накажут.","Выгодно сделать: сохраню работу и получу расположение начальства.","Коллектив рассчитывает на меня; подвести своих было бы неправильно.","Долг сотрудника — соблюдать закон и стандарты; сокрытие дефекта нарушает обязанности перед обществом.","Здоровье и права потребителей нельзя приносить в жертву выгоде; я сообщу о дефекте и буду добиваться изменений."]},
{t:"Вы нашли кошелёк с крупной суммой и документами. Владельца легко найти, но деньги вам очень нужны.",
o:["Верну: если узнают, что оставил себе, будут проблемы.","Оставлю, если никто не узнает: мне это выгодно.","Верну: порядочный человек так поступает, и мне будет стыдно перед близкими.","Чужая собственность неприкосновенна; общество держится на соблюдении таких правил.","Верну: уважение к правам другого человека — основа доверия людей друг к другу, даже когда это дорого."]},
{t:"Активист публично блокирует стройку, нарушая закон, который считает несправедливым. Оправдано ли это?",
o:["Нет: закон есть закон, за нарушение накажут.","Это его дело: если ему выгодно и он готов рискнуть — пусть.","Он борется за то, что важно людям рядом; но многие осудят его как смутьяна.","Нет: нарушение закона разрушает порядок; надо действовать через суды и выборы.","Допустимо как крайняя мера, если нарушены базовые права, при открытости и готовности принять последствия."]},
{t:"Вы руководитель, и есть одно место на обучение за счёт компании. Друг — средний специалист, другой кандидат — явно сильнее. Кого выбрать?",
o:["Друга: если выберу другого, он обидится и будут проблемы.","Друга: он потом отплатит услугой.","Друга: поддерживать близких — это правильно, меня бы осудили за обратное.","Сильнейшего: роль руководителя обязывает следовать установленным критериям.","Сильнейшего: равный доступ к возможностям — принцип справедливости; о конфликте интересов скажу открыто."]}];
const S=["Стадия 1. Наказание и послушание","Стадия 2. Инструментальный обмен","Стадия 3. Межличностное соответствие","Стадия 4. Закон и порядок","Стадия 5. Общественный договор и права"];
const L={pre:["Доконвенциональный уровень","Решения чаще опираются на последствия для себя: наказание, выгоду, обмен услугами.","Попробуйте задавать себе вопрос «а как это выглядит для другого человека?». Разбирайте реальные ситуации: кто пострадал и что почувствовал. Полезно читать истории и обсуждать их с людьми, чьё мнение вам важно."],
con:["Конвенциональный уровень","Вы опираетесь на ожидания близких и общества, правила, роли и долг. Это устойчивая основа социальной жизни.","Для роста проверяйте правила на справедливость: кому они выгодны и кого оставляют без защиты. Разбирайте дилеммы, где долг и права людей конфликтуют, и обсуждайте их с теми, кто думает иначе."],
post:["Постконвенциональный уровень","Вы склонны оценивать правила через права и принципы справедливости, а не только по самому факту их существования.","Следите, чтобы принципы подкреплялись действиями и ответственностью за последствия. Учитывайте контекст и чувства людей, проверяйте свои выводы в диалоге с оппонентами."]};
const el=document.getElementById("app");let i=0,A=[],name="";
const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
function start(){el.innerHTML=`<div class="card"><h1>Диагностика нравственных суждений</h1><p>6 ситуаций. В каждой выберите рассуждение, которое ближе вашему мышлению, а не то, которое кажется «правильным». Нет верных и неверных ответов. Время: 5–7 минут.</p><p class="m">Это образовательный инструмент на основе теории Л. Кольберга, а не клиническая диагностика.</p><input type="text" id="n" placeholder="Имя или код (необязательно)"><div class="row"><button class="p" onclick="name=document.getElementById('n').value.trim();show()">Начать</button></div></div>`}
function show(){const d=D[i],idx=sh([0,1,2,3,4]);
el.innerHTML=`<div class="card"><div class="m">Ситуация ${i+1} из ${D.length}</div><h2>${d.t}</h2>${idx.map(k=>`<label class="o"><input type="radio" name="q" value="${k}" onchange="document.getElementById('nx').disabled=false"> ${d.o[k]}</label>`).join("")}<div class="row"><button class="p" id="nx" disabled onclick="next()">${i==D.length-1?"Показать результат":"Далее"}</button></div></div>`}
function next(){A.push(+document.querySelector("input[name=q]:checked").value);i++;i<D.length?show():finish()}
function finish(){const c=[0,0,0,0,0];A.forEach(a=>c[a]++);const n=A.length,pc=c.map(v=>Math.round(v/n*100)),avg=+(A.reduce((s,a)=>s+a+1,0)/n).toFixed(2),
dom=c.indexOf(Math.max(...c))+1,lv=avg<2.5?"pre":avg<4?"con":"post";
const r={date:new Date().toISOString(),id:name||"аноним",answers:A.map(a=>a+1),percent_by_stage:pc,index:avg,dominant_stage:dom,level:L[lv][0]};
try{const h=JSON.parse(localStorage.getItem("kohlberg")||"[]");h.push(r);localStorage.setItem("kohlberg",JSON.stringify(h))}catch(e){}
el.innerHTML=`<div class="card"><h1>Ваш результат</h1><p><b>${L[lv][0]}</b> · преобладающая стадия: ${dom} · индекс зрелости: ${avg} из 5</p>
${S.map((s,k)=>`<div>${s}: ${pc[k]}%</div><div class="bar"><i style="width:${pc[k]}%"></i></div>`).join("")}
<h2>Что это значит</h2><p>${L[lv][1]}</p><h2>Рекомендации</h2><p>${L[lv][2]}</p>
<p class="m">Стадия 6 (универсальные этические принципы) в коротком тесте не измеряется. Результат отражает ваши ответы сейчас и не оценивает вас как человека.</p>
<div class="row"><button class="p" onclick="dl()">Скачать результат (JSON)</button><button onclick="location.reload()">Пройти заново</button></div><p class="m" id="st"></p></div>`;
window.R=r;if(SEND_URL){fetch(SEND_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(r)}).then(()=>st.textContent="Результат отправлен.").catch(()=>st.textContent="Не удалось отправить, скачайте файл.")}}
function dl(){const b=new Blob([JSON.stringify(window.R,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="kohlberg_result_"+Date.now()+".json";a.click()}
start();
</script></main></body></html>
